          if (o.n < 3 || o.i0 === 0 || passing(text, o)) continue;
          // the text's numbers are one phrase (a date, a range): it lands with the first of them said
          const t0 = scan[o.i0].t, from = `lt=${t0.toFixed(1)}s`; let first = null;
          for (const n of numsIn(text)) {
            if (carried.some(c => close(c, n.v))) continue;
            const hit = nums.filter(m => close(m.v, n.v)).sort((p, q) => said[p.at].s - said[q.at].s)[0], w = hit && saidSpan(said, hit.at, hit.to);
            if (w && !(n.lone && hit.said === 'one') && (!first || w.s < first.s)) first = w; // a lone "one" is often a pronoun
            if (!w && !n.lone) { texts.set('unsaid:' + text, `the number "${n.s}" in "${text}" is on screen from ${from} to lt=${scan[o.i1].t.toFixed(1)}s, but this shot's lines never say it (they say ${nums.length ? nums.map(m => `"${m.said}"`).join(', ') : 'no number'}): a number on screen is one the voice says in this shot (rounded at most 5%) or one carried in from the shot before (on screen from the first frame); remove it, or show the number the line says`); first = null; break; }
          }
          if (first && t0 < first.s - 1) texts.set('early:' + text, `"${text}" appears at ${from}, ${(first.s - t0).toFixed(1)} s before the voice says "${first.said}" (lt=${first.s.toFixed(1)}s): a number lands with its words, at most 1 s before they are said; time it to h.cue(${JSON.stringify(first.said)}${first.n > 1 ? `, ${first.n}` : ''})`);
        }
        // a label shows only while its thing is visible. Its thing: the placement(s) h.label or h.measure gave its point (within 80 px
        // of its words), else the asset its words name (id, who or which: "Earth" for which: 'earth'). A country's name in a shot that
        // draws the map names the country on the map, not the character who stands for it
        const nameOf = a => { if (!a.nm) { let p = {}; try { p = JSON.parse(a.act || '{}'); } catch { } a.nm = cueNorm(`${String(a.id).replace(/[_-]+/g, ' ')} ${a.who || ''} ${p.which || ''}`); } return a.nm; };
        const names = (ws, toks) => ws.every(w => toks.some(n => same(n, w)));
        const known = new Map(), bad = new Map();
        scan.forEach((f, i) => { for (const x of f.texts) {
          const text = x.text.trim(), near = f.links.filter(l => l.at[0] > x.x0 - 80 && l.at[0] < x.x1 + 80 && l.at[1] > x.y0 - 80 && l.at[1] < x.y1 + 80); let gone = [];
          if (near.length) gone = near.flatMap(l => l.things).filter(a => !shows(a)).map(nm);
          else if (!/\d/.test(text) && !(MAPS && countryNamed(text))) { const ws = labelToks(text), key = ws.join(' ');
            if (ws.length && !known.has(key)) known.set(key, [...new Set(scan.flatMap(g => g.assets.filter(a => names(ws, nameOf(a))).map(nm)))]);
            if (ws.length && known.get(key).length && !f.assets.some(a => shows(a) && names(ws, nameOf(a)))) gone = known.get(key); }
          if (gone.length) { const b = bad.get(text) || []; if (b[b.length - 1]?.i !== i) b.push({ i, gone }); bad.set(text, b); } } });
        // it counts when it lasts 0.4 s (5 checked frames in a row): a thing fading in under a carried label is not one
        for (const [text, b] of bad) for (let k = 0; k + 4 < b.length; k++) if (b[k + 4].i === b[k].i + 4) { let e = k + 4; while (b[e + 1] && b[e + 1].i === b[e].i + 1) e++;
          texts.set('alone:' + text, `the label "${text}" shows at lt=${scan[b[k].i].t.toFixed(1)}s to ${scan[b[e].i].t.toFixed(1)}s while its thing ${[...new Set(b[k].gone)].join(', ')} is not visible: a label comes with its thing, so show the thing first and the label only while the thing shows (a label belongs to the thing h.label or h.measure placed it by, else to the asset its words name)`); break; }
        // a cued change lands at least 0.8 s before the shot ends. It has landed when the frame looks as it does with that cue word
        // said early (at 0.5 s: shots also clamp "cue - 0.35" at 0), or, when the cue drives motion that never settles (a camera
        // drifting on after it arrives: saying the word at 0.5 s or 0.87 s gives different frames), when saying it 0.37 s earlier
        // changes the frame no more than that
        const tE = sh.dur - 0.8, snapAt = (tt, sft) => { CUE_SHIFT = sft; try { render(tt, { still: true }); return snap(); } catch { return null; } finally { CUE_SHIFT = null; } };
        if (tE > 0.5) for (const [key, c] of [...CUES].sort((p, q) => p[1].t - q[1].t)) {
          const landed = tt => { const f = snapAt(tt, null), g = snapAt(tt, { key, at: 0.5 }), g2 = snapAt(tt, { key, at: 0.87 }); if (!f || !g || !g2) return true;
            const idle = diff(g, g2); if (diff(f, g) <= 0.4 + 1.5 * idle) return true; if (c.t >= tt - 0.1 || idle < 0.05) return false;
            const fe = snapAt(tt, { key, at: Math.max(0.01, c.t - 0.37) }); return !fe || diff(f, fe) <= 0.25 + 1.5 * idle; };
          if (landed(tE)) continue;
          let lands = null; for (let tt = tE + 0.1; tt < sh.dur - 0.02 && lands == null; tt += 0.1) if (landed(tt)) lands = tt;
          texts.set('cue:' + key, `the change timed to h.cue(${JSON.stringify(c.word)}${c.n > 1 ? `, ${c.n}` : ''}) (said at lt=${c.t.toFixed(1)}s) is still under way at lt=${tE.toFixed(1)}s, 0.8 s before this ${sh.dur.toFixed(1)} s shot ends${lands != null ? `, and lands at about ${lands.toFixed(1)}s` : ', and has not settled by the cut'}, so it is cut off or gone before it reads: a cued change lands at least 0.8 s before the shot ends. Time it to an earlier word where the thing first matters (or the line's start), then hold it (gentle idle motion on lt is fine)`);
        }
      }
      // an overlap counts when it lasts: seen in two checked frames, or still there 0.3 s before or after (a pop's overshoot is not one)
      for (const [k, c] of clash) for (const tt of [c.t - 0.3, c.t + 0.3]) if (c.n < 2 && tt > 0.05 && tt < sh.dur - 0.05) { TRACK = { texts: [], assets: [] }; try { render(tt, { still: true }); if (overlaps(tt).has(k)) c.n++; } catch { } TRACK = null; }
      for (const c of clash.values()) if (c.n >= 2) errors.push(c.m);
      errors.push(...texts.values());
      if (maxMs > 180) errors.push(`too slow: ${maxMs.toFixed(0)} ms per frame`);
    }
  } finally { STRICT = false; TRACK = null; TL = saved; CUES = null; CUE_SHIFT = null; }
  return { ok: !errors.length, errors, stats: { frameDetail: frameDetail.map(v => +v.toFixed(2)), acts: heroAt.map(a => a && a.act), shown: [...shown], lp: lpSeen }, maxMs: +maxMs.toFixed(1), preview: frames.length ? sheet(frames, 270, 480) : null };
};
